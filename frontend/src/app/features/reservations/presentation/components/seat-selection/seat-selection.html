<div class="card shadow-sm p-4">
  <h4>Selectează locuri</h4>

  <app-seat-grid 
      [seats]="seats"
      (seatSelected)="selectSeat($event)">
  </app-seat-grid>

  <div class="mt-3">
    <h5>Locuri selectate:</h5>
    <span *ngFor="let s of selectedSeats" class="badge bg-primary me-1">
      {{ s.row }}-{{ s.number }}
    </span>
  </div>
</div>

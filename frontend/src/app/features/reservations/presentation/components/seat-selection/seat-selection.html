<div class="card shadow-sm p-4">
  <h4>Selectează locuri</h4>
  <p class="text-muted">Click pe un loc disponibil pentru a-l selecta</p>

  <app-seat-grid 
      [seats]="seats"
      (seatSelected)="selectSeat($event)">
  </app-seat-grid>

  <div class="mt-3" *ngIf="selectedSeats.length > 0">
    <h5>Locuri selectate ({{ selectedSeats.length }}):</h5>
    <div class="selected-seats">
      <span *ngFor="let s of selectedSeats" class="badge bg-primary me-2 mb-2">
        {{ s.row }}-{{ s.number }}
      </span>
    </div>
  </div>
  <div class="mt-3" *ngIf="selectedSeats.length === 0">
    <p class="text-warning">Selectează cel puțin un loc pentru a continua</p>
  </div>
</div>

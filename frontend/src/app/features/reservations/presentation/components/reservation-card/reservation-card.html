<div class="card shadow-sm reservation-card">
  <div class="card-body">

    <h5 class="card-title">
      Rezervare #{{ reservation.id }}
    </h5>

    <p class="text-muted">{{ reservation.screening.movie.title }}</p>

    <p>
      <strong>Status: </strong> 
      <span class="badge bg-primary">{{ reservation.status }}</span>
    </p>

    <p>
      <strong>Total:</strong> {{ reservation.totalPrice }} RON
    </p>

    <button class="btn btn-outline-primary w-100 mt-2"
            [routerLink]="['/reservations', reservation.id]">
      Detalii
    </button>

  </div>
</div>

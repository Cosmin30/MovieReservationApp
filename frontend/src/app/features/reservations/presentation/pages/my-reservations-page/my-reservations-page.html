<div class="container mt-4">

  <h3 class="mb-4">Rezervările mele</h3>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="alert alert-info">
    <div class="spinner-border spinner-border-sm me-2" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    Se încarcă rezervările...
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && !error && reservations.length === 0" class="alert alert-warning">
    <p class="mb-0">Nu ai nici o rezervare. <a routerLink="/movies" class="alert-link">Explorează filmele disponibile</a></p>
  </div>

  <!-- Reservations List -->
  <div *ngIf="!isLoading && !error && reservations.length > 0" class="row">
    <div *ngFor="let r of reservations" class="col-md-6 col-lg-4 mb-4">
      <app-reservation-card [reservation]="r"></app-reservation-card>
    </div>
  </div>

</div>

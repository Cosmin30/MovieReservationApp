<div class="container mt-5">

  <div class="text-center mb-5">
    <h1 class="fw-bold">Bine ai venit la Movie Reservation!</h1>
    <p class="lead">Alege un film, verifică proiecțiile și rezervă-ți locul.</p>
  </div>

  <div class="row justify-content-center">

    <!-- Card Filme -->
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body text-center">
          <h4 class="card-title">Filme</h4>
          <p class="card-text">Vezi lista completă de filme disponibile.</p>
          <a routerLink="/movies" class="btn btn-primary">Vezi filme</a>
        </div>
      </div>
    </div>

    <!-- Card Proiecții -->
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body text-center">
          <h4 class="card-title">Proiecții</h4>
          <p class="card-text">Alege un film și vezi programul sălilor.</p>
          <a routerLink="/screenings" class="btn btn-primary">Vezi proiecții</a>
        </div>
      </div>
    </div>

    <!-- Card Săli -->
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body text-center">
          <h4 class="card-title">Săli</h4>
          <p class="card-text">Explorează layout-ul fiecărei săli.</p>
          <a routerLink="/halls" class="btn btn-primary">Vezi săli</a>
        </div>
      </div>
    </div>

  </div>

</div>

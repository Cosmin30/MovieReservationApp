<div class="home-page">
  <div class="container mt-5">
    
    <!-- Welcome Section -->
    <div class="welcome-section mb-5" *ngIf="authService.currentUser$ | async as user">
      <div class="welcome-card">
        <div class="welcome-icon">
          <i class="fas fa-film"></i>
        </div>
        <h1 class="welcome-title">
          Bine ai venit, <span class="user-name-highlight">{{ user.fullName }}</span>!
        </h1>
        <p class="welcome-subtitle">Alege un film, verifică proiecțiile și rezervă-ți locul.</p>
      </div>
    </div>

    <!-- Quick Actions Grid -->
    <div class="row justify-content-center g-4">
      
      <!-- Card Filme -->
      <div class="col-md-4">
        <div class="feature-card">
          <div class="card-icon">
            <i class="fas fa-film"></i>
          </div>
          <h4 class="card-title">Filme</h4>
          <p class="card-text">Vezi lista completă de filme disponibile.</p>
          <a routerLink="/movies" class="btn-action">
            <span>Vezi filme</span>
            <i class="fas fa-arrow-right"></i>
          </a>
        </div>
      </div>

      <!-- Card Proiecții -->
      <div class="col-md-4">
        <div class="feature-card">
          <div class="card-icon">
            <i class="fas fa-calendar-alt"></i>
          </div>
          <h4 class="card-title">Proiecții</h4>
          <p class="card-text">Alege un film și vezi programul sălilor.</p>
          <a routerLink="/screenings" class="btn-action">
            <span>Vezi proiecții</span>
            <i class="fas fa-arrow-right"></i>
          </a>
        </div>
      </div>

      <!-- Card Săli -->
      <div class="col-md-4">
        <div class="feature-card">
          <div class="card-icon">
            <i class="fas fa-building"></i>
          </div>
          <h4 class="card-title">Săli</h4>
          <p class="card-text">Explorează layout-ul fiecărei săli.</p>
          <a routerLink="/halls" class="btn-action">
            <span>Vezi săli</span>
            <i class="fas fa-arrow-right"></i>
          </a>
        </div>
      </div>

    </div>

  </div>
</div>

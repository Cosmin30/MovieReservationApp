<button
  class="btn seat-box"
  [ngClass]="{
    'available': seat?.status === 'AVAILABLE',
    'reserved': seat?.status === 'RESERVED',
    'unavailable': seat?.status === 'UNAVAILABLE',
    'selected': seat?.isSelected
  }"
  (click)="selectSeat()"
  [disabled]="seat?.status !== 'AVAILABLE'"
>
  {{ seat?.row }}-{{ seat?.number }}
</button>

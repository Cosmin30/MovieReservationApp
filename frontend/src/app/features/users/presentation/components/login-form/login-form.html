<form (ngSubmit)="submit()" class="card p-4 shadow-sm">

  <h4 class="mb-3">Autentificare</h4>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" [(ngModel)]="form.email" name="email" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Parola</label>
    <input type="password" class="form-control" [(ngModel)]="form.password" name="password" required>
  </div>

  <button class="btn btn-primary w-100">Login</button>

</form>

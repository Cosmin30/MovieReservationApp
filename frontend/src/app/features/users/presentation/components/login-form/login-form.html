<div class="auth-card">
  <form (ngSubmit)="submit()" #f="ngForm" class="auth-form">

    <h2 class="form-title">Autentificare</h2>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input 
        type="email" 
        class="form-control" 
        [(ngModel)]="form.email" 
        name="email" 
        placeholder="email@exemplu.ro"
        required>
    </div>

    <div class="form-group">
      <label class="form-label">Parola</label>
      <input 
        type="password" 
        class="form-control" 
        [(ngModel)]="form.password" 
        name="password" 
        placeholder="Introduceți parola"
        required>
    </div>

    <button type="submit" class="btn btn-primary btn-login" [disabled]="!f.valid">
      Intră în cont
    </button>
    
  </form>

  <div class="auth-footer">
    <p class="footer-text">Nu ai cont?</p>
    <a routerLink="/register" class="btn btn-register">
      Creează cont nou
    </a>
  </div>
</div>

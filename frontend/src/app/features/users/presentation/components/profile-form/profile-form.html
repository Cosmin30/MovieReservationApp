<form (ngSubmit)="submit()" class="card p-4 shadow-sm">

  <h4 class="mb-3">Profil utilizator</h4>

  <div class="mb-3">
    <label class="form-label">Nume complet</label>
    <input class="form-control" [(ngModel)]="form.fullName" name="fullName" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" [(ngModel)]="form.email" name="email" required>
  </div>

  <button class="btn btn-primary w-100">Actualizează</button>

</form>

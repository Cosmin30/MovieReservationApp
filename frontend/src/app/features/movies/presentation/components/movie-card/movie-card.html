<div class="card shadow-sm movie-card">
  <div class="card-img-container position-relative">
    <img [src]="imageUrl" 
         class="card-img-top" 
         alt="{{ movie.title }}"
         (error)="onImageError()"
         (load)="isLoadingImage = false"
         [style.opacity]="isLoadingImage ? 0.5 : 1">
    <div *ngIf="isLoadingImage" class="d-flex justify-content-center align-items-center h-100 position-absolute top-0 start-0 end-0 bottom-0">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title mb-0">{{ movie.title }}</h5>
      <button *ngIf="authService.isAdmin()" 
              class="btn btn-sm btn-danger"
              (click)="deleteMovie.emit(movie.id)"
              title="Șterge film">
        <i class="fas fa-trash"></i>
      </button>
    </div>
    <p class="text-muted">{{ genre }}</p>

    <p class="card-text description">
      {{ movie.description }}
    </p>

    <button [routerLink]="['/movies', movie.id]" class="btn btn-primary w-100">
      <i class="fas fa-info-circle"></i> Detalii
    </button>
  </div>
</div>

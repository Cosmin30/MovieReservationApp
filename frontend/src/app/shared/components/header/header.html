<nav *ngIf="isLoggedIn" class="app-navbar">
  <div class="nav-container">
    <a class="nav-brand" routerLink="/home">
      <span class="brand-text">Movie Reservation</span>
    </a>
    
    <button class="nav-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="toggler-line"></span>
      <span class="toggler-line"></span>
      <span class="toggler-line"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="nav-menu">
        <li class="nav-item">
          <a routerLink="/movies" routerLinkActive="active" class="nav-link">
            Filme
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/screenings" routerLinkActive="active" class="nav-link">
            Proiecții
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/halls" routerLinkActive="active" class="nav-link">
            Săli
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/reservations" routerLinkActive="active" class="nav-link">
            Rezervări
          </a>
        </li>

        @if (authService.currentUser$ | async; as user) {
          <li class="nav-item user-item">
            <div class="user-info">
              <div class="user-avatar">
                {{ user.fullName.charAt(0).toUpperCase() }}
              </div>
              <span class="user-name">{{ user.fullName }}</span>
              @if (authService.isAdmin()) {
                <span class="admin-badge">ADMIN</span>
              }
            </div>
          </li>
          <li class="nav-item">
            <button class="logout-btn" (click)="logout()">
              Logout
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
